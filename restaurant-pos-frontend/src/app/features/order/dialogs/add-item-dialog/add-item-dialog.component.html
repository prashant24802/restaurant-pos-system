<h2 mat-dialog-title>Add Item</h2>

<mat-dialog-content>

  <div *ngIf="loading" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <form
    *ngIf="!loading"
    [formGroup]="form">

    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Menu Item</mat-label>

      <mat-select formControlName="menuItemId">

        <mat-option
          *ngFor="let item of menuItems"
          [value]="item.id">

          {{ item.name }} -
          ₹{{ item.price }}

        </mat-option>

      </mat-select>

      <mat-error
        *ngIf="form.get('menuItemId')?.hasError('required')">

        Please select an item.

      </mat-error>

    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Quantity</mat-label>

      <input
        matInput
        type="number"
        formControlName="quantity">

      <mat-error
        *ngIf="form.get('quantity')?.invalid">

        Quantity must be at least 1.

      </mat-error>

    </mat-form-field>

    <p
      class="empty"
      *ngIf="!menuItems.length">

      No menu items available.

    </p>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    (click)="close()">

    Cancel

  </button>

  <button
    mat-flat-button
    color="primary"
    [disabled]="saving || loading || form.invalid || !menuItems.length"
    (click)="addItem()">

    Add Item

  </button>

</mat-dialog-actions>
